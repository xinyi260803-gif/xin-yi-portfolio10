<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Tamu Tycoon</title><desc id="desc">Illustrated weekend tamu stall with produce, price tags, a cash box and coins.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f6e9d7"/><stop offset="1" stop-color="#e4d5ed"/></linearGradient>
  <linearGradient id="awning" x2="0" y2="1"><stop stop-color="#795b9a"/><stop offset="1" stop-color="#59416f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#45334f" flood-opacity=".18"/></filter>
</defs>
<rect width="1200" height="720" fill="url(#bg)"/>
<circle cx="1010" cy="130" r="170" fill="#fff" opacity=".28"/><circle cx="170" cy="610" r="210" fill="#fff" opacity=".24"/>
<rect x="105" y="70" width="990" height="580" rx="30" fill="#fffaf4" filter="url(#shadow)"/>
<text x="160" y="135" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="5" fill="#80658d">MOBILE GAME PROTOTYPE</text>
<text x="160" y="205" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#463451">TAMU TYCOON</text>
<text x="164" y="244" font-family="Arial,sans-serif" font-size="23" fill="#826e88">Run your stall. Make smart choices. Grow your business.</text>
<!-- market stall -->
<g filter="url(#shadow)">
  <path d="M290 330 L385 270 H835 L930 330 Z" fill="#4e3b61"/>
  <path d="M310 326 H910 V390 H310 Z" fill="url(#awning)"/>
  <path d="M310 326 H910 V390 H310 Z" fill="none" stroke="#493456" stroke-width="5"/>
  <path d="M310 326 H410 V390 H310 Z M510 326 H610 V390 H510 Z M710 326 H810 V390 H710 Z" fill="#f4d9a8"/>
  <rect x="330" y="390" width="560" height="190" rx="8" fill="#bd855b"/>
  <rect x="350" y="410" width="520" height="150" rx="5" fill="#e7c49a"/>
  <path d="M350 500 H870" stroke="#c18f63" stroke-width="5"/>
</g>
<!-- produce baskets -->
<g>
  <path d="M390 490 Q410 440 485 445 Q560 440 580 490 L565 545 H405 Z" fill="#7f9a68"/>
  <path d="M405 490 H565 M415 510 H555 M425 530 H545" stroke="#d7dfbd" stroke-width="7" stroke-linecap="round"/>
  <circle cx="430" cy="452" r="25" fill="#e8a94e"/><circle cx="475" cy="445" r="27" fill="#c95f4f"/><circle cx="520" cy="454" r="24" fill="#e8a94e"/>
  <path d="M465 416 q10-22 25-12 q-2 18-25 12" fill="#66875e"/><path d="M510 425 q8-20 24-12 q-3 17-24 12" fill="#66875e"/>
  <path d="M625 490 Q645 440 720 445 Q795 440 815 490 L800 545 H640 Z" fill="#a76b4c"/>
  <path d="M640 490 H800 M650 510 H790 M660 530 H780" stroke="#e6bd91" stroke-width="7" stroke-linecap="round"/>
  <circle cx="675" cy="450" r="25" fill="#d8a65e"/><circle cx="720" cy="444" r="27" fill="#8eaa6d"/><circle cx="765" cy="454" r="24" fill="#d8a65e"/>
</g>
<!-- price cards -->
<g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
  <path d="M420 300 h110 v82 h-110 z" fill="#fff6df" stroke="#e2c58e" stroke-width="4"/>
  <text x="475" y="332" font-size="17" fill="#86633f">FRESH</text><text x="475" y="360" font-size="24" fill="#57415f">RM 5</text>
  <path d="M690 300 h110 v82 h-110 z" fill="#fff6df" stroke="#e2c58e" stroke-width="4"/>
  <text x="745" y="332" font-size="17" fill="#86633f">SPECIAL</text><text x="745" y="360" font-size="24" fill="#57415f">RM 8</text>
</g>
<!-- money and ledger -->
<g>
  <rect x="850" y="470" width="95" height="75" rx="10" fill="#57436c"/><rect x="860" y="480" width="75" height="16" rx="5" fill="#d9c7e5"/>
  <circle cx="880" cy="520" r="13" fill="#e8bf62" stroke="#b58c3f" stroke-width="3"/><circle cx="915" cy="520" r="13" fill="#e8bf62" stroke="#b58c3f" stroke-width="3"/>
</g>
<g transform="translate(170 500)"><circle cx="0" cy="0" r="38" fill="#e7bd65" stroke="#bb9147" stroke-width="6"/><text x="0" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#805d2d">$</text><circle cx="78" cy="35" r="28" fill="#e7bd65" stroke="#bb9147" stroke-width="5"/><text x="78" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#805d2d">$</text></g>
<rect x="160" y="600" width="880" height="2" fill="#e9dce9"/>
<text x="160" y="630" font-family="Arial,sans-serif" font-size="18" letter-spacing="2" fill="#80658d">BUSINESS SIMULATION  ·  FINANCIAL LITERACY</text>
</svg>